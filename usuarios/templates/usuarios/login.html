{% extends 'blog/base.html' %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<h1>Iniciar sesión</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Entrar</button>
</form>

<p class="mt-3">
    ¿No tenés cuenta?
    <a href="{% url 'usuarios:registro' %}">Registrate</a>
</p>
{% endblock %}
