{% extends 'blog/base.html' %}

{% block title %}{{ post.titulo }} | Mi Blog{% endblock %}

{% block content %}

<article>

    <h1>{{ post.titulo }}</h1>

    <p class="text-muted">
        Por {{ post.autor.username }}
        el {{ post.fecha_creacion|date:"d/m/Y H:i" }}
    </p>

    <div class="mt-4">
        {{ post.contenido|linebreaks }}
    </div>

</article>

<a href="{% url 'blog:post_list' %}" class="btn btn-secondary mt-3">
    Volver
</a>

{% endblock %}
